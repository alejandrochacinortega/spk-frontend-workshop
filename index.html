<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navbar Demo</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- NAVBAR: this is the part you will style with Flexbox -->
    <header class="navbar">
        <a class="logo" href="#">🍕 Favorite Foods</a>

        <nav>
            <ul class="nav-links">
                <li class="nav-item"><a href="#menu">Menu</a></li>
                <li class="nav-item"><a href="#deals">Deals</a></li>
                <li class="nav-item"><a href="#contributors">Contributors</a></li>
                <li class="nav-item"><a href="#contact">Contact</a></li>
            </ul>
        </nav>

        <a class="cta-button" href="#contact">Book a table</a>
    </header>

    <main>
        <section class="hero">
            <h1>Welcome to our Favorite Foods 🍕 🥦 🥩 🍖</h1>
            <p>Dishes suggested by our team, from Norway to Venezuela.</p>
        </section>

        <section id="menu" class="menu">
            <h2>Menu</h2>
            <ol>
                <li class="week-background">Focaccia</li>
                <li class="day-background">Pinsa</li>
                <li class="week-background">Pabellon Criollo</li>
                <li class="day-background">Sushi</li>
            </ol>
        </section>
    </main>

    <footer id="contact">
        <p>😋 Our restaurant needs more dishes 😋</p>
    </footer>
</body>
</html>
